<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Visor de PDF</title>
  <link rel="stylesheet" href="./viewer.css">
</head>
<body>
  <nav aria-label="Controles del documento">
    <button id="previous" aria-label="Página anterior" disabled>Anterior</button>
    <label>Página <input id="page" type="number" min="1" value="1" inputmode="numeric" disabled></label>
    <span id="total" aria-live="polite">de 0</span>
    <button id="next" aria-label="Página siguiente" disabled>Siguiente</button>
    <button id="less" aria-label="Reducir zoom" disabled>−</button>
    <span id="zoom">100 %</span>
    <button id="more" aria-label="Aumentar zoom" disabled>+</button>
    <button id="fit" disabled>Ajustar</button>
  </nav>
  <p id="status" role="status" aria-live="polite">Preparando visor…</p>
  <main id="pages" aria-label="Documento PDF"><canvas id="canvas" role="img" aria-label="Página del documento"></canvas></main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
