  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Headline counts for the dashboard
      description: Centers and active teachers are current population totals regardless of creation date. Date bounds filter resources, surveys and alerts by creation date and events by event date. All figures respect the caller's scope and active professional family.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProvinceQuery"
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date for the dashboard period.
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date for the dashboard period.
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/statistics:
    get:
      operationId: getDashboardStatistics
      tags: [dashboard]
      summary: Time series and grouped stats for charts
      description: Users by role and centers by island show current population regardless of creation date. Date bounds apply to resources, events and surveys only. All figures respect the caller's scope and active professional family.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProvinceQuery"
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date for the dashboard period.
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date for the dashboard period.
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatistics"
