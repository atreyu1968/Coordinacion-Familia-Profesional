        "200":
          description: Certificates bound to the authenticated and verified email
          content:
            application/json:
              schema:
                type: object
                properties:
                  emailVerified: { type: boolean }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MyAttendanceCertificate" }
                  pendingEvents:
                    type: array
                    items: { $ref: "#/components/schemas/OwnAttendancePendingEvent" }
                required: [emailVerified, items, pendingEvents]
        default: { $ref: "#/components/responses/AttendanceError" }
  /me/attendance-certificates/email-code:
    post:
      operationId: sendAttendanceEmailCode
      tags: [events]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Verification code sent to the account's own email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
        default: { $ref: "#/components/responses/AttendanceError" }
  /me/attendance-certificates/issue:
    post:
      operationId: issueMyAttendanceCertificate
      tags: [events]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueOwnAttendanceCertificateInput" }
      responses:
        "200":
          description: Own confirmed attendance issued; verified matching email required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceCertificatePdf" }
        default: { $ref: "#/components/responses/AttendanceError" }
  /me/attendance-certificates/verify-email:
    post:
      operationId: verifyAttendanceEmail
      tags: [events]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
              required: [code]
      responses:
        "200":
          description: Email ownership verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
        default: { $ref: "#/components/responses/AttendanceError" }
