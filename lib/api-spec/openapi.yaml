        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "409":
          description: Account changed concurrently; reload before retrying
        "200":
          description: Reactivated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /lms/courses:
    get:
      operationId: listLmsCourses
      tags: [lms]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Courses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LmsCourse" } } } } }
    post:
      operationId: createLmsCourse
      tags: [lms]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsCourseInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/LmsCourseDetail" } } } }
  /lms/course-imports/request-url:
    post:
      operationId: requestLmsCourseImportUploadUrl
      tags: [lms]
      summary: Request a private upload URL for a complete course ZIP
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LmsCourseImportUploadInput"
      responses:
        "200":
          description: Private upload URL and one-use import token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LmsUploadResponse"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /lms/courses/{courseId}/position:
    put:
      operationId: saveLmsCoursePosition
      tags: [lms]
      description: Saves the signed-in learner's reading position, never completion. Draft previews cannot persist a position.
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LmsCoursePositionInput" }
      responses:
        "204": { description: Reading position saved without changing completion or attempts }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /lms/courses/import:
    post:
      operationId: importLmsCourseArchive
      tags: [lms]
      summary: Import a complete draft course from a validated ZIP archive
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LmsCourseImportInput"
      responses:
        "201":
          description: Imported course in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LmsCourseImportResponse"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /lms/courses/{courseId}:
    get:
      operationId: getLmsCourse
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CourseIdPath" }]
      responses:
        "200": { description: Course, content: { application/json: { schema: { $ref: "#/components/schemas/LmsCourseDetail" } } } }
    patch:
      operationId: updateLmsCourse
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CourseIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsCourseUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/LmsCourseDetail" } } } }
    delete:
      operationId: deleteLmsCourse
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CourseIdPath" }]
      responses: { "204": { description: Deleted } }
  /lms/courses/{courseId}/cover:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getLmsCourseCover
      responses:
        "200":
          description: Portada privada del curso
          content:
            image/webp:
              schema: { type: string, format: binary }
    put:
      operationId: setLmsCourseCover
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LmsCourseCoverInput" }
      responses:
        "200":
          description: Curso con su nueva portada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LmsCourseDetail" }
    delete:
      operationId: removeLmsCourseCover
      responses:
        "200":
          description: Curso sin portada propia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LmsCourseDetail" }
  /lms/courses/{courseId}/export:
    get:
      operationId: exportLmsCourse
      tags: [lms]
      summary: Download a course as a version 1 ZIP archive
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CourseIdPath" }]
      responses:
        "200":
          description: Course ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /lms/courses/export:
    post:
      operationId: exportLmsCourses
      tags: [lms]
      summary: Download multiple managed courses as one ZIP archive
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LmsCourseExportInput" }
      responses:
        "200":
          description: ZIP archive containing the selected courses and an export report
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "422":
          description: No requested course could be included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LmsCourseExportFailure" }
  /lms/courses/{courseId}/publish:
    post:
      operationId: publishLmsCourse
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CourseIdPath" }]
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/LmsCourseDetail" } } } }
  /lms/courses/{courseId}/lessons:
    post:
      operationId: createLmsLesson
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CourseIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsLessonInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/LmsLesson" } } } }
  /lms/lessons/{lessonId}:
    patch:
      operationId: updateLmsLesson
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/LessonIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsLessonUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/LmsLesson" } } } }
    delete:
      operationId: deleteLmsLesson
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/LessonIdPath" }]
      responses: { "204": { description: Deleted } }
  /lms/uploads/request-url:
    post:
      operationId: requestLmsUploadUrl
      tags: [lms]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsUploadInput" } } } }
      responses:
        "200": { description: Upload URL, content: { application/json: { schema: { $ref: "#/components/schemas/LmsUploadResponse" } } } }
  /lms/lessons/{lessonId}/download-token:
    post:
      operationId: createLmsLessonDownloadToken
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/LessonIdPath" }]
      responses:
        "200": { description: Short-lived file download URL, content: { application/json: { schema: { $ref: "#/components/schemas/LmsDownloadToken" } } } }
  /lms/files:
    get:
      operationId: downloadLmsLessonFile
      tags: [lms]
      parameters: [{ $ref: "#/components/parameters/LmsTokenQuery" }]
      responses:
        "200": { description: Private course file, content: { "*/*": { schema: { type: string, format: binary } } } }
  /lms/lessons/{lessonId}/complete:
    post:
      operationId: completeLmsLesson
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/LessonIdPath" }]
      responses:
        "200": { description: Progress, content: { application/json: { schema: { $ref: "#/components/schemas/LmsProgress" } } } }
  /lms/lessons/{lessonId}/quiz-attempt:
    post:
      operationId: submitLmsQuizAttempt
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/LessonIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsQuizAttemptInput" } } } }
      responses:
        "200": { description: Result, content: { application/json: { schema: { $ref: "#/components/schemas/LmsQuizResult" } } } }
  /lms/management/scopes:
    get:
      operationId: getLmsManagementScopes
      tags: [lms]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Scopes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LmsManagementScope" } } } } }
  /lms/general/managers:
    get:
      operationId: getLmsGeneralManagers
      tags: [lms]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Managers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LmsManager" } } } } }
    put:
      operationId: updateLmsGeneralManagers
      tags: [lms]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsManagersInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LmsManager" } } } } } }
  /lms/modules/{moduleId}/managers:
    get:
      operationId: getLmsModuleManagers
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ModuleIdPath" }]
      responses: { "200": { description: Managers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LmsManager" } } } } } }
    put:
      operationId: updateLmsModuleManagers
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ModuleIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsManagersInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LmsManager" } } } } } }
  /lms/courses/{courseId}/certificate:
    get:
      operationId: downloadLmsCertificate
      deprecated: true
      summary: Retired endpoint
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CourseIdPath" }]
      responses: { "401": { description: Authentication required }, "404": { description: Resource unavailable } }
  /lms/courses/{courseId}/scorm-session:
    post:
      operationId: createLmsScormSession
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CourseIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsScormSessionInput" } } } }
      responses: { "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/LmsScormSession" } } } } }
  /lms/lessons/{lessonId}/scorm-session:
    post:
      operationId: createLmsLessonScormSession
      tags: [lms]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/LessonIdPath" }
        - name: preview
          in: query
          description: Manager-only preview session that never records learner progress.
          schema: { type: boolean, default: false }
      responses: { "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/LmsScormSession" } } } } }
  /lms/scorm/session:
    get:
      operationId: getLmsScormSession
      tags: [lms]
      parameters: [{ $ref: "#/components/parameters/LmsTokenQuery" }]
      responses:
        "200": { description: SCORM session, content: { application/json: { schema: { $ref: "#/components/schemas/LmsScormSession" } } } }
  /lms/scorm/commit:
    post:
      operationId: commitLmsScormSession
      tags: [lms]
      parameters: [{ $ref: "#/components/parameters/LmsTokenQuery" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LmsScormCommitInput" } } } }
      responses: { "200": { description: Progress, content: { application/json: { schema: { $ref: "#/components/schemas/LmsProgress" } } } } }
  /lms/scorm/sessions/{token}/content/{assetPath}:
    get:
      operationId: getLmsScormContent
      tags: [lms]
      parameters:
        - $ref: "#/components/parameters/TokenPath"
        - name: assetPath
          in: path
          required: true
          schema: { type: string }
      responses: { "200": { description: SCORM asset, content: { "*/*": { schema: { type: string, format: binary } } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CourseIdPath:
      name: courseId
      in: path
      required: true
      schema: { type: integer }
    LessonIdPath:
      name: lessonId
      in: path
      required: true
      schema: { type: integer }
    ModuleIdPath:
      name: moduleId
      in: path
      required: true
      schema: { type: integer }
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TokenPath:
      name: token
      in: path
      required: true
      schema:
        type: string
    LmsTokenQuery:
      name: token
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    StatusQuery:
      name: status
      in: query
      schema:
        type: string
    RoleQuery:
      name: role
      in: query
      schema:
        $ref: "#/components/schemas/Role"
    ProvinceQuery:
      name: provinceId
      in: query
      schema:
        type: integer
    IslandQuery:
      name: islandId
      in: query
      schema:
        type: integer
    MunicipalityQuery:
      name: municipalityId
      in: query
      schema:
        type: integer
    CenterQuery:
      name: centerId
      in: query
      schema:
        type: integer
    SearchQuery:
      name: search
      in: query
      schema:
        type: string
  responses:
    AttendanceError:
      description: Invalid input (400), sign-in required (401), forbidden (403), not found (404), state conflict (409), closed registration (410), throttled (429) or email unavailable (503)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    NormativaReview:
      type: object
      required: [status, reviewNote, expectedStatus]
      properties:
        status:
          type: string
          enum: [reviewed, dismissed]
        expectedStatus:
          type: string
          enum: [pending, catalog]
        reviewNote:
          type: string
          minLength: 1
          maxLength: 4000
    NormativaPublication:
      type: object
      required: [id, source, officialId, title, url, publishedAt, detectedAt, checkedAt, relevance, reason, status, reviewNote, reviewedBy, reviewedAt]
      properties:
        id: { type: integer }
        source: { type: string, enum: [BOE, BOC] }
        officialId: { type: string }
        title: { type: string }
        url: { type: string }
        publishedAt: { type: [string, "null"] }
        detectedAt: { type: string }
        checkedAt: { type: string }
        relevance: { type: string, enum: [adg, general, other, uncertain] }
        reason: { type: string }
        status: { type: string, enum: [pending, reviewed, dismissed, catalog] }
        reviewNote: { type: string }
        reviewedBy: { type: [integer, "null"] }
        reviewedAt: { type: [string, "null"] }
    NormativaSource:
      type: object
      required: [source, startedFrom, coveredThrough, attemptedAt, succeededAt, error]
      properties:
        source: { type: string }
        startedFrom: { type: string }
        coveredThrough: { type: [string, "null"] }
        attemptedAt: { type: [string, "null"] }
        succeededAt: { type: [string, "null"] }
        error: { type: [string, "null"] }
    NormativaList:
      type: object
      required: [items, sources, total, running, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NormativaPublication" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/NormativaSource" }
        total: { type: integer }
        running: { type: boolean }
        enabled: { type: boolean }
    LmsCourseCoverInput:
      type: object
      properties:
        objectPath: { type: string, minLength: 1 }
        intentToken: { type: string, minLength: 1 }
      required: [objectPath, intentToken]
    LmsCourse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        moduleId: { type: [integer, "null"] }
        status: { type: string, enum: [draft, published] }
        certificateEnabled: { type: boolean }
        lessonCount: { type: integer }
        completed: { type: boolean }
        certificateAvailable: { type: boolean }
        coverUrl: { type: [string, "null"] }
      required: [id, title, description, moduleId, status, certificateEnabled, lessonCount, completed, certificateAvailable]
    LmsCoursePositionInput:
      type: object
      additionalProperties: false
      properties:
        lessonId: { type: integer, minimum: 1 }
      required: [lessonId]
    LmsCourseDetail:
      allOf:
        - $ref: "#/components/schemas/LmsCourse"
        - type: object
          properties:
            lastOpenedLessonId:
              type: [integer, "null"]
              description: Last lesson opened by the signed-in user; independent of completion.
            lessons:
              type: array
              items: { $ref: "#/components/schemas/LmsLesson" }
            progress:
              type: array
              items: { $ref: "#/components/schemas/LmsProgress" }
          required: [lessons, progress, lastOpenedLessonId]
    LmsCourseInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        moduleId: { type: [integer, "null"] }
        certificateEnabled: { type: boolean }
      required: [title]
    LmsCourseExportInput:
      type: object
      properties:
        courseIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: integer, minimum: 1 }
      required: [courseIds]
    LmsCourseExportFailure:
      type: object
      properties:
        message: { type: string }
        excluded:
          type: array
          items:
            type: object
            properties:
              courseId: { type: integer }
              title: { type: string }
              reason: { type: string }
            required: [courseId, title, reason]
      required: [message, excluded]
    LmsCourseImportUploadInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 104857600 }
        contentType: { type: string, minLength: 1, maxLength: 255 }
        moduleId: { type: [integer, "null"], minimum: 1 }
      required: [name, size, contentType, moduleId]
    LmsCourseImportInput:
      type: object
      properties:
        objectPath: { type: string, minLength: 1, maxLength: 1024 }
        intentToken: { type: string, minLength: 20, maxLength: 256 }
        moduleId: { type: [integer, "null"], minimum: 1 }
      required: [objectPath, intentToken, moduleId]
    LmsCourseImportResponse:
      type: object
      properties:
        course: { $ref: "#/components/schemas/LmsCourseDetail" }
        importedLessonCount: { type: integer, minimum: 1 }
        warnings:
          type: array
          items: { type: string }
      required: [course, importedLessonCount, warnings]
    LmsCourseImportManifest:
      type: object
      additionalProperties: false
      properties:
        format: { type: string, enum: [coordina-adg-course] }
        version: { type: integer, enum: [1] }
        course:
          type: object
          additionalProperties: false
          properties:
            title: { type: string, minLength: 1, maxLength: 180 }
            description: { type: string, maxLength: 10000 }
            certificateEnabled: { type: boolean }
            cover: { type: string, minLength: 1, maxLength: 512, description: Ruta relativa opcional de la imagen de portada dentro del ZIP }
          required: [title]
        lessons:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/LmsCourseImportLessonManifest" }
      required: [format, version, course, lessons]
    LmsCourseImportLessonManifest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        kind: { type: string, enum: [text, file, video, quiz, scorm12, scorm2004] }
        required: { type: boolean }
        content: { type: object, additionalProperties: true }
        file: { type: string, minLength: 1, maxLength: 512 }
      required: [title, kind]
    LmsCourseUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        moduleId: { type: [integer, "null"] }
        certificateEnabled: { type: boolean }
    LmsLesson:
      type: object
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [text, file, video, quiz, scorm12, scorm2004] }
        position: { type: integer }
        required: { type: boolean }
        content: { type: object, additionalProperties: true }
        objectName: { type: [string, "null"] }
        objectContentType: { type: [string, "null"] }
        objectSize: { type: [integer, "null"] }
        scormVersion: { type: [string, "null"] }
        scormLaunchPath: { type: [string, "null"] }
      required: [id, courseId, title, kind, position, required, content, objectName, objectContentType, objectSize, scormVersion, scormLaunchPath]
    LmsLessonInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        kind: { type: string, enum: [text, file, video, quiz, scorm12, scorm2004] }
        position: { type: integer }
        required: { type: boolean }
        content: { type: object, additionalProperties: true }
        objectPath: { type: string }
        objectName: { type: string }
        objectContentType: { type: string }
        objectSize: { type: integer }
        intentToken: { type: string }
      required: [title, kind]
    LmsLessonUpdate:
      allOf:
        - $ref: "#/components/schemas/LmsLessonInput"
    LmsProgress:
      type: object
      properties:
        lessonId: { type: integer }
        status: { type: string, enum: [not_started, in_progress, completed, failed] }
        score: { type: [integer, "null"] }
        attempts: { type: integer }
        completedAt: { type: [string, "null"], format: date-time }
      required: [lessonId, status, score, attempts, completedAt]
    LmsQuizAttemptInput:
      type: object
      properties:
        selectedIndexes: { type: array, items: { type: integer } }
