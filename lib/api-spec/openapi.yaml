      required: [id, name, description, memberCount, canManage, createdAt]
    CollaborativeSpacePerson:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        centerId: { type: integer, nullable: true }
        centerName: { type: string, nullable: true }
      required: [id, name, email, role, status, centerId, centerName]
    CollaborativeSpaceDetail:
      allOf:
        - $ref: "#/components/schemas/CollaborativeSpace"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/CollaborativeSpacePerson"
          required: [members]
    CollaborativeSpaceCandidates:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/CollaborativeSpacePerson"
        centers:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
            required: [id, name]
      required: [users, centers]
    CollaborativeSpaceMembersInput:
      type: object
      properties:
        userIds:
          type: array
          maxItems: 1000
          items: { type: integer, minimum: 1 }
        centerIds:
          type: array
          maxItems: 200
          items: { type: integer, minimum: 1 }
    CollaborativeSpaceInfoInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
      required: [name]
    CreateCollaborativeSpaceInput:
      allOf:
        - $ref: "#/components/schemas/CollaborativeSpaceInfoInput"
        - $ref: "#/components/schemas/CollaborativeSpaceMembersInput"
    ConfirmYearInput:
      type: object
      properties:
        centerId:
          type: integer
        moduleIds:
          type: array
          items:
            type: integer
        doesNotTeach:
          type: boolean
      required: [centerId, moduleIds, doesNotTeach]
