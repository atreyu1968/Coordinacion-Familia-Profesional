  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the authenticated user's own profile
      description: Lets a user edit their own name, email and password. Role, status and scope are not editable here. Changing the password revokes existing sessions and requires signing in again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      requiresReauthentication:
                        type: boolean
                        description: True when changing the password has revoked this session.
                      message:
                        type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/me/teaching-profile:
    get:
      operationId: getMyTeachingProfile
      tags: [auth]
      summary: Get the current teaching profile for teachers, department heads, coordinators and superadministrators
      description: Returns the active-year assignments and module options for the requested center. Only active-family centers and modules are included.
      security:
        - bearerAuth: []
      parameters:
        - name: targetCenterId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Current teacher teaching profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTeachingProfile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMyTeachingProfile
      tags: [auth]
      summary: Update the authenticated user's teaching center, modules, or no-teaching declaration
      description: Available to teachers, department heads, coordinators and superadministrators. Derives the teaching province from the selected center and reconciles active-year assignments or an explicit no-teaching declaration. Personal teaching centers for administrative roles do not change their management center or province. Only modules of the active professional family are accepted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyTeachingProfileInput"
      responses:
        "200":
          description: Updated teacher and active-year assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTeachingProfileUpdateResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/invitations/{token}:
