openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Coordina ADG API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and cascade registration
  - name: invitations
    description: Cascade invitation codes
  - name: users
    description: User management
  - name: geo
    description: Provinces, islands and municipalities
  - name: centers
    description: Educational centers directory and training offer
  - name: academics
    description: Modules, groups, teaching assignments and resources
  - name: ai
    description: DeepSeek AI assistant
  - name: fct
    description: FCT support, company alerts and GDCAN
  - name: surveys
    description: Surveys and voting
  - name: events
    description: Events, accreditations, staff, spaces and calendar
  - name: messaging
    description: Chat, announcements and notifications
  - name: dashboard
    description: Statistics and AI annual reports
  - name: settings
    description: Superadmin control panel and API credentials
  - name: documentForms
    description: Document-submission forms and submissions dashboard
  - name: storage
    description: Object storage upload and serving endpoints
  - name: feedback
    description: In-app improvement suggestions and incident reports
  - name: meetings
    description: Videoconference meeting rooms (Jitsi)
  - name: lms
    description: Autodirigido learning courses and certificates
  - name: coordinator-tasks
    description: Private coordinator task follow-up from minutes, messages and email

paths:
  /wiki/normativa:
    get:
      operationId: listNormativa
      tags: [Wiki]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, reviewed, dismissed, catalog, all]
            default: pending
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Seguimiento privado para gestores de documentación general
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormativaList"
        "403":
          description: Sin permiso de gestión
  /wiki/normativa/check:
    post:
      operationId: checkNormativa
      tags: [Wiki]
      responses:
        "202":
          description: Comprobación en curso o encolada
        "403":
          description: Sin permiso
        "409":
          description: Familia profesional no compatible con el clasificador ADG
  /wiki/normativa/{id}/review:
    patch:
      operationId: reviewNormativa
      tags: [Wiki]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NormativaReview"
      responses:
        "200":
          description: Revisión humana guardada sin modificar la wiki
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormativaPublication"
        "400":
          description: Datos no válidos
        "403":
          description: Sin permiso
        "404":
          description: Publicación no encontrada
        "409":
          description: Otro responsable ya revisó la publicación; actualizar
  /coordinator-mail/workspace:
    get:
      operationId: getCoordinatorMailWorkspace
      tags: [coordinator-mail]
      summary: Get the authenticated coordinator's private mail workspace and connection status
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: status
          in: query
          schema: { type: string, enum: [open, waiting, closed] }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Owner-private mail cases.
          content:
            application/json:
                schema: { $ref: "#/components/schemas/CoordinatorMailCaseSummary" }
        "403": { $ref: "#/components/responses/Error" }
  /coordinator-mail/cases/{id}:
    get:
      operationId: getCoordinatorMailCase
      tags: [coordinator-mail]
      summary: Get one private mail case
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: messagePage, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Case details, recent messages and private notes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailCaseDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCoordinatorMailCase
      tags: [coordinator-mail]
      summary: Update case, status or reviewed reply draft with optimistic revision
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoordinatorMailCaseUpdate" }
      responses:
        "200":
          description: Updated private case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailCaseDetail" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /coordinator-mail/cases/{id}/links:
    post:
      operationId: addCoordinatorMailCaseLink
      tags: [coordinator-mail]
      summary: Link two private mail cases owned by the authenticated coordinator
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoordinatorMailCaseLinkInput" }
      responses:
        "200":
          description: Linked case details with the shared chronological history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailCaseDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /coordinator-mail/cases/{id}/links/{linkedId}:
    delete:
      operationId: removeCoordinatorMailCaseLink
      tags: [coordinator-mail]
      summary: Unlink a case from the authenticated coordinator's private group
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - name: linkedId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated case details after unlinking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailCaseDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /coordinator-mail/cases/{id}/notes:
    post:
      operationId: addCoordinatorMailCaseNote
      tags: [coordinator-mail]
      summary: Add a private case note to its chronological history
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoordinatorMailNoteInput" }
      responses:
        "201":
          description: Saved note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailCaseDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /coordinator-mail/cases/{id}/ai-draft:
    post:
      operationId: generateCoordinatorMailReplyDraft
      tags: [coordinator-mail]
      summary: Queue an authorized AI reply draft without sending email
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoordinatorMailAiDraftInput" }
      responses:
        "202":
          description: Drafting queued for this case revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailCaseDetail" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /coordinator-mail/cases/{id}/send:
    post:
      operationId: sendCoordinatorMailReply
      tags: [coordinator-mail]
      summary: Explicitly queue the coordinator-reviewed Gmail reply
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoordinatorMailSendInput" }
      responses:
        "202":
          description: Queued for Gmail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailOutboxItem" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /coordinator-mail/attachments/{id}:
    get:
      operationId: downloadCoordinatorMailAttachment
      tags: [coordinator-mail]
      summary: Download an attachment only if its parent email belongs to the caller
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Private attachment bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /coordinator-mail/gmail/connect:
    post:
      operationId: startCoordinatorGmailOAuth
      tags: [coordinator-mail]
      summary: Begin Google authorization for the current coordinator's dedicated mailbox
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Google authorization URL.
          content:
            application/json:
              schema:
                type: object
                properties: { authorizationUrl: { type: string, format: uri } }
                required: [authorizationUrl]
        "503": { $ref: "#/components/responses/Error" }
  /coordinator-mail/gmail/callback:
    get:
      operationId: finishCoordinatorGmailOAuth
      tags: [coordinator-mail]
      summary: One-time Google OAuth callback protected by state and browser cookie
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "200":
          description: Completes connection and redirects to the app.
          content:
            text/html:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /coordinator-mail/gmail:
    delete:
      operationId: disconnectCoordinatorGmail
      tags: [coordinator-mail]
      summary: Disconnect only this coordinator's Gmail account and preserve saved cases
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account disconnected; local case history retained.
          content:
            application/json:
              schema:
                type: object
                properties: { disconnected: { type: boolean } }
                required: [disconnected]
  /coordinator-mail/gmail/sync:
    post:
      operationId: syncCoordinatorGmail
      tags: [coordinator-mail]
      summary: Queue a deduplicated mailbox sync for the current coordinator
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Synchronization queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailCaseSummary" }
        "403": { $ref: "#/components/responses/Error" }
  /coordinator-mail/admin-settings:
    get:
      operationId: getCoordinatorMailAdminSettings
      tags: [coordinator-mail]
      summary: Read non-secret Google OAuth configuration status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Never returns the Google OAuth client secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailAdminSettings" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCoordinatorMailAdminSettings
      tags: [coordinator-mail]
      summary: Configure the self-hostable Google OAuth web app from superadmin control panel
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoordinatorMailSettingsUpdate" }
      responses:
        "200":
          description: Saved, masked OAuth configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorMailAdminSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /coordinator-tasks:
    get:
      operationId: listCoordinatorTasks
      tags: [coordinator-tasks]
      summary: List the authenticated coordinator's private tasks
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Coordinator tasks, including AI suggestions awaiting review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorTaskList" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCoordinatorTask
      tags: [coordinator-tasks]
      summary: Add a task manually
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoordinatorTaskInput" }
      responses:
        "201":
          description: Manually created task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorTask" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /coordinator-tasks/analyze:
    post:
      operationId: analyzeCoordinatorTaskSources
      tags: [coordinator-tasks]
      summary: Analyze new, authorized sources and create task suggestions for review
      description: Reads only published final minutes within the coordinator's scope, messages received directly or in groups they belong to, and received emails in their own connected mailbox.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Analysis counts and any extraction warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorTaskAnalysis" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /coordinator-tasks/{id}:
    patch:
      operationId: updateCoordinatorTask
      tags: [coordinator-tasks]
      summary: Update task status, resolution, or review decision
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoordinatorTaskUpdate" }
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinatorTaskResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /document-forms:
    get:
      operationId: listDocumentForms
      tags: [documentForms]
      summary: List document forms (province + global scoped)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, open, closed]
      responses:
        "200":
          description: Forms list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentFormSummary"
    post:
      operationId: createDocumentForm
      tags: [documentForms]
      summary: Create a document form with its fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentFormInput"
      responses:
        "201":
          description: Form created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFormDetail"
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /document-forms/{id}:
    get:
      operationId: getDocumentForm
      tags: [documentForms]
      summary: Get a document form with its fields and the caller's submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Form detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFormDetail"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDocumentForm
      tags: [documentForms]
      summary: Soft-delete a document form
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted.
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /document-forms/{id}/submissions:
    get:
      operationId: listDocumentFormSubmissions
      tags: [documentForms]
      summary: List submissions for a form (managers only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submissions and fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFormSubmissionsResponse"
        "403":
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: submitDocumentForm
      tags: [documentForms]
      summary: Submit or update the caller's submission for a form
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDocumentFormInput"
      responses:
        "200":
          description: Submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Form not open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List feedback (own for regular users, all for superadmin)
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [suggestion, incident]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, reviewed, resolved]
      responses:
        "200":
          description: Feedback list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit a suggestion or incident report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedback/{id}:
    patch:
      operationId: updateFeedback
      tags: [feedback]
      summary: Update feedback status (superadmin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedbackInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List videoconference meeting rooms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Meeting list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create a meeting room (coordinator or superadmin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /meetings/{id}:
    delete:
      operationId: deleteMeeting
      tags: [meetings]
      summary: Delete a meeting room (host or superadmin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted.
        "403":
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /meetings/token:
    post:
      operationId: getMeetingToken
      tags: [meetings]
      summary: Issue a ready-to-join meeting URL (8x8 JaaS, or public Jitsi fallback)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingTokenInput"
      responses:
        "200":
          description: Join access for the requested room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAccess"
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/modules:
    get:
      operationId: listForumModules
      tags: [forum]
      summary: List modules with forum thread counts (grouped by cycle in UI)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Forum modules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumModule"
  /forum/modules/{moduleId}/moderation-history:
    get:
      operationId: listForumModerationHistory
      tags: [forum]
      summary: List moderation actions for a module forum
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModuleIdPath"
      responses:
        "200":
          description: Moderation history for the module.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumModerationEvent"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /forum/threads:
